name: rotacred_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  jwt_decode: ^0.3.1
  jwt_decoder: ^2.0.1
  shared_preferences: ^2.2.2
  mask_text_input_formatter: ^2.9.0
  geolocator: ^13.0.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  intl: ^0.19.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2
  connectivity_plus: ^6.0.3
  uuid: ^4.5.3
  crypto: ^3.0.7
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/playstore.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/logoeditado.png
  color_dark: "#121212"
  image_dark: assets/logoeditado.png

  android_12:
    image: assets/logoeditado.png
    icon_background_color: "#ffffff"
    image_dark: assets/logoeditado.png
    icon_background_color_dark: "#121212"

  web: false
